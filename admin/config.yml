# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: The-DigitalAcademy/shaper-elearning-content

media_folder: /media
public_folder: /media

collections:
  - name: content_items
    label: Content Items
    label_singular: Content Item
    folder: /content/content_items
    summary: '{{type | upper}} | {{title}}'
    icon: library_books
    preview_path: '/shaper-elearning-content/tools/html-editor?collection=content_items&field=content&slug={{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: ['page', 'assignment', 'chapter', 'quiz'] }
      - { label: Description, name: description, widget: richtext, required: false }
      - name: iframe_tag
        label: IFrame Tag
        widget: compute
        value: '<iframe title="{{fields.type}} - {{fields.title}}" style="width: 100%;height: 100vh;" src="https://the-digitalacademy.github.io/shaper-elearning-content/tools/html-page/index.html?collection=content_items&slug={{fields.title | slugify}}&field=content"></iframe>'
      - { label: Content (HTML), name: content, widget: code, allow_language_selection: false, default_language: html, preview: false, required: false}